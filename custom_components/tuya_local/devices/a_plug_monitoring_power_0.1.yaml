name: Custom Monitoring Plug - Power Scaling
products:
  - id: eewaqh6oycm6ev2w
  - id: uqehhcrmk5depvtl
entities:
  # Switches
  - entity: switch
    class: outlet
    dps:
      - id: 1
        type: boolean
        name: switch
  # Sensors
  - entity: sensor
    class: energy
    category: diagnostic
    dps:
      - id: 25
        type: integer
        name: calibration
        optional: true

  - entity: sensor
    category: diagnostic
    hidden: true
    class: energy
    dps:
      - id: 17
        name: sensor
        type: integer
        unit: kWh
        class: total_increasing
        optional: true
        mapping:
        - scale: 1000

  - entity: sensor
    class: current
    category: diagnostic
    dps:
      - id: 18
        name: sensor
        type: integer
        class: measurement
        force: true
        unit: mA
      - id: 23
        type: integer
        name: calibration
        optional: true

  - entity: sensor
    class: power
    category: diagnostic
    dps:
      - id: 19
        name: sensor
        type: integer
        class: measurement
        unit: W
        mapping:
          - scale: 0.1
      - id: 24
        type: integer
        name: calibration
        optional: true

  - entity: sensor
    class: voltage
    category: diagnostic
    dps:
      - id: 20
        name: sensor
        type: integer
        class: measurement
        force: true
        unit: V
        mapping:
          - scale: 10
      - id: 22
        type: integer
        name: calibration
        optional: true

  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 26
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 26
        type: bitfield
        name: fault_code

  # Configurations
  - entity: select
    category: config
    translation_key: initial_state
    dps:
      - id: 38
        type: string
        name: option
        mapping:
          - dps_val: "on"
            value: "on"
          - dps_val: "off"
            value: "off"
          - dps_val: "memory"
            value: memory

  - entity: select
    translation_key: light_mode
    category: config
    dps:
      - id: 39
        type: string
        name: option
        mapping:
          - dps_val: relay
            value: state
          - dps_val: pos
            value: locator
          - dps_val: none
            value: none

  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 40
        type: boolean
        name: lock

  - entity: switch
    name: Overcharge protection
    category: config
    dps:
      - id: 51
        type: boolean
        name: switch
